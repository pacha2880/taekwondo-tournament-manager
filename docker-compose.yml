services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taekwondo
      POSTGRES_PASSWORD: taekwondo
      POSTGRES_DB: taekwondo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taekwondo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://taekwondo:taekwondo@db:5432/taekwondo
      SECRET_KEY: dev-secret-key
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
