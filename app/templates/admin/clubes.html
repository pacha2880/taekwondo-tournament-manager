{% extends "admin/base.html" %}
{% block title %}Clubes{% endblock %}
{% block content %}
<h1 class="mb-4">Clubes</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<div class="row">
  <div class="col-md-6">
    <ul class="list-group mb-4">
      {% for c in clubs %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ c.name }}
        <a href="/admin/clubes/{{ c.id }}/editar" class="btn btn-sm btn-outline-secondary">Editar</a>
      </li>
      {% else %}
      <li class="list-group-item text-muted">Todavía no hay clubes.</li>
      {% endfor %}
    </ul>
  </div>
  <div class="col-md-6">
    <h2 class="h5">Crear club</h2>
    <form method="post" action="/admin/clubes" data-confirm="Crear club">
      <div class="mb-2">
        <label class="form-label">Nombre</label>
        <input type="text" name="name" class="form-control" required value="{{ form.name }}">
      </div>
      <button type="submit" class="btn btn-primary">Crear</button>
    </form>
  </div>
</div>
{% endblock %}
